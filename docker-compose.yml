# Mission Mars — Lander Engineering Laboratory
#
#   docker compose up -d --build      # first time / after updates (needs internet)
#   docker compose up -d              # at the event (works offline)
#   docker compose down               # stop (data is kept in the volume)
#
# Settings come from .env (copy .env.example to .env).

name: mission-mars

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mission-mars:latest
    container_name: mission-mars
    restart: unless-stopped
    # Standard bridge networking. The backend reaches the sensor on the LAN by
    # its IP address through Docker Desktop's NAT; no host networking or
    # privileged mode is needed.
    ports:
      # Bound to localhost by default (operator laptop only). Set APP_BIND=0.0.0.0
      # in .env to allow a second screen/tablet on the network to connect.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8000"
    # App settings come from .env via env_file, so variables that happen to be
    # set in the Windows environment for other projects (DATABASE_URL,
    # LOG_LEVEL, ...) are NOT picked up. Without a .env file the built-in
    # defaults (same as .env.example) apply.
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed container-internal paths; these override anything in .env. Data
      # lives in the mission-data volume below.
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/mars_lander.db
    volumes:
      - mission-data:/data
      # Edit config/evb_profile.json on the laptop, then press
      # "Reload EVB profile" in the operator dashboard.
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mission-data:
